name: My Telegram build
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch submodules from upstream
        run: |
          git config --global url."https://github.com/TelegramMessenger/".insteadOf "https://github.com/${{ github.repository_owner }}/"
          git submodule sync --recursive
          git submodule update --init --recursive --jobs 8

      - name: Set active Xcode
        run: |
          XCODE_VERSION=$(python3 -c 'import json;print(json.load(open("versions.json"))["xcode"])')
          echo "versions.json требует Xcode $XCODE_VERSION"
          ls /Applications | grep -i xcode
          if [ -d "/Applications/Xcode_$XCODE_VERSION.app" ]; then
            sudo xcode-select -s "/Applications/Xcode_$XCODE_VERSION.app/Contents/Developer"
          else
            echo "Точной версии нет, остаётся Xcode по умолчанию"
          fi
          xcodebuild -version

      - name: Create canonical source directory
        run: |
          sudo mkdir -p /Users/Shared
          cp -R "$GITHUB_WORKSPACE" /Users/Shared/
          mv /Users/Shared/$(basename "$GITHUB_WORKSPACE") /Users/Shared/telegram-ios

      - name: Extend expired fake profiles
        working-directory: /Users/Shared/telegram-ios
        run: |
          python3 - <<'EOF'
          import glob, re
          n = 0
          for p in glob.glob("build-system/fake-codesigning/profiles/*.mobileprovision"):
              data = open(p, "rb").read()
              new = re.sub(rb"(<key>ExpirationDate</key>\s*<date>)\d{4}(-)", rb"\g<1>2036\g<2>", data)
              if new != data:
                  open(p, "wb").write(new)
                  n += 1
          print("профилей изменено:", n)
          EOF

      - name: Relax profile signature check
        working-directory: /Users/Shared/telegram-ios
        run: |
          python3 - <<'EOF'
          import glob, re
          changed = []
          for p in glob.glob("build-system/**/*.py", recursive=True):
              s = open(p, encoding="utf-8").read()
              new = re.sub(r"""(["'])-noverify\1""", r"\g<1>-noverify\g<1>, \g<1>-nosigs\g<1>", s)
              if new != s:
                  open(p, "w", encoding="utf-8").write(new)
                  changed.append(p)
          print("изменены файлы:", changed)
          if not changed:
              raise SystemExit("Не нашёл вызов openssl с -noverify в скриптах сборки")
          EOF
          grep -rn "nosigs" build-system/ | head -10

      - name: Build
        working-directory: /Users/Shared/telegram-ios
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
        run: |
          cp build-system/appstore-configuration.json my-config.json
          python3 - <<'EOF'
          import json, os
          c = json.load(open("my-config.json"))
          c["api_id"] = os.environ["TG_API_ID"]
          c["api_hash"] = os.environ["TG_API_HASH"]
          json.dump(c, open("my-config.json", "w"), indent=2)
          EOF
          python3 build-system/Make/ImportCertificates.py \
            --path build-system/fake-codesigning/certs
          python3 -u build-system/Make/Make.py \
            --overrideXcodeVersion \
            --cacheDir="$HOME/telegram-bazel-cache" \
            build \
            --configurationPath=my-config.json \
            --codesigningInformationPath=build-system/fake-codesigning \
            --buildNumber=100001 \
            --configuration=release_arm64

      - name: Collect IPA
        run: |
          mkdir -p out
          cp /Users/Shared/telegram-ios/bazel-out/applebin_ios-ios_arm*-opt-ST-*/bin/Telegram/Telegram.ipa out/

      - uses: actions/upload-artifact@v4
        with:
          name: telegram-ipa
          path: out/Telegram.ipa
